{% extends 'base.html' %}

{% block title %}Ejercicio 1 - Formulario de Notas{% endblock %}

{% block content %}
<div class="card">
    <h1>Formulario de Notas</h1>
    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <div class="form-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1" min="10" max="70" step="any" value="{{ nota1 }}" required>
        </div>

        <div class="form-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2" min="10" max="70" step="any" value="{{ nota2 }}" required>
        </div>

        <div class="form-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3" min="10" max="70" step="any" value="{{ nota3 }}" required>
        </div>

        <div class="form-group">
            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="any" value="{{ asistencia }}" required>
        </div>

        <button type="submit" class="btn-submit">Enviar</button>
    </form>

    {% if promedio is not none %}
    <div class="resultado-ej1">
        <p>{{ promedio }}</p>
        <p>{{ estado }}</p>
    </div>
    {% endif %}

<!-- atribucion personal, asi no hay que apretar el boton atras del navegador  -->
    <a href="{{ url_for('index') }}" class="link-volver">← Volver al menú</a>
</div>
{% endblock %}
